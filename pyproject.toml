[project]
name = "selfplay"
version = "0.1.0"
description = "Self-play RL for autonomous cyber defense using MiniCAGE"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pytest>=7.0",
    "absl-py>=2.0",
    "fancyflags @ git+https://github.com/google-deepmind/fancyflags.git",
    "gymnasium>=0.29",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.0",
    "seaborn>=0.13",

    "torch>=2.0",
    "wandb>=0.15",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/selfplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
