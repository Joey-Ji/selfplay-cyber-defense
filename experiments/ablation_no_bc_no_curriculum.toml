# Ablation: vanilla self-play, NO Blue BC, NO curriculum mixing
# Baseline condition — pure self-play with cold-start
#
# Usage:
#   python scripts/train_all.py --config experiments/ablation_no_bc_no_curriculum.toml

seeds = [42, 123]
save_dir = "out/models_ablation_no_bc_no_curriculum"
results_dir = "out/results_ablation_no_bc_no_curriculum"

[[strategies]]
name = "vanilla"
delta = 1.0

[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 3
n_steps = 2048
batch_size = 512
ent_coef = 0.01

[selfplay]
total_rounds = 300
rounds_per_side = 5
checkpoint_freq = 1
max_pool_size = 200
max_steps = 100
blue_scripted_opponent_prob = 0.0
blue_scripted_opponents = ["red_bline", "red_meander"]
blue_scripted_opponent_weights = [0.5, 0.5]
blue_pretrain_path = ""
red_pretrain_path = ""

[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5

[wandb]
use_wandb = false
