# Paper reproduction (milestone report).
#
# Usage:
#   just train-all                          # uses this by default
#   just config=experiments/quick.toml smoke  # quick test instead

seeds = [42, 123, 456]
save_dir = "out/models"
results_dir = "out/results"

# Add, remove, or edit entries to change what experiments run.

[[strategies]]
name = "vanilla"
delta = 1.0

[[strategies]]
name = "delta_uniform"
delta = 0.3

[[strategies]]
name = "delta_uniform"
delta = 0.5

[[strategies]]
name = "delta_uniform"
delta = 0.7

[[strategies]]
name = "pfsp"
delta = 0.0


[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 6
n_steps = 2048
batch_size = 64
ent_coef = 0.01


[selfplay]
total_rounds = 500
rounds_per_side = 10
max_steps = 100
checkpoint_freq = 1
max_pool_size = 200


[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5
