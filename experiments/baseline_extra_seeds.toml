# Extra baseline seeds for delta_uniform d=0.7.
# Matches paper.toml settings but with rounds_per_side=5 (like anchor configs).

seeds = [789, 1024]
save_dir = "out/models_baseline_extra"
results_dir = "out/results_baseline_extra"

[[strategies]]
name = "delta_uniform"
delta = 0.7

[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 6
n_steps = 2048
batch_size = 64
ent_coef = 0.01

[selfplay]
total_rounds = 500
rounds_per_side = 5
max_steps = 100
checkpoint_freq = 1
max_pool_size = 200

[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5
