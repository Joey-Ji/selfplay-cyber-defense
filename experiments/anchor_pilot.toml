# One-seed anchored self-play pilot:
#   - base strategy: delta-uniform (delta=0.7)
#   - Blue training opponent mix: 70% learned checkpoint pool, 30% scripted (B-line/Meander)

seeds = [42]
save_dir = "out/models_anchor_pilot"
results_dir = "out/results_anchor_pilot"

[[strategies]]
name = "delta_uniform"
delta = 0.7

[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 6
n_steps = 2048
batch_size = 64
ent_coef = 0.01

[selfplay]
total_rounds = 100
rounds_per_side = 5
max_steps = 100
checkpoint_freq = 1
max_pool_size = 200

# Anchored scripted-opponent mix for Blue training.
blue_scripted_opponent_prob = 0.3
blue_scripted_opponents = ["red_bline", "red_meander"]
blue_scripted_opponent_weights = [0.5, 0.5]

[eval]
br_steps = 10_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5
