# Curriculum mixing intensity sweep: p=0.1 and p=0.7
# Complements existing p=0.0 (bc_only), p=0.3 (final.toml), p=0.5 (ablation_bc_curriculum_p05.toml)
# to form a 5-point sweep: {0.0, 0.1, 0.3, 0.5, 0.7}.
#
# Note: This config sets p=0.1. To run p=0.7, either:
#   (a) Create a separate TOML, or
#   (b) Override via code: change blue_scripted_opponent_prob below.
#
# We include both p=0.1 and p=0.7 as separate strategy entries here, but since
# the selfplay section is shared, we split into two files below.
#
# THIS FILE: p=0.1
#
# Usage:
#   python scripts/train_all.py --config experiments/curriculum_sweep.toml

seeds = [42, 123, 456]
save_dir = "out/models_curriculum_p01"
results_dir = "out/results_curriculum_p01"

[[strategies]]
name = "vanilla"
delta = 1.0

[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 3
n_steps = 2048
batch_size = 512
ent_coef = 0.01

[selfplay]
total_rounds = 300
rounds_per_side = 5
checkpoint_freq = 1
max_pool_size = 200
max_steps = 100
blue_scripted_opponent_prob = 0.1
blue_scripted_opponents = ["red_bline", "red_meander"]
blue_scripted_opponent_weights = [0.5, 0.5]
blue_pretrain_path = "out/models/blue_pretrained.pt"
red_pretrain_path = "out/models/red_pretrained.pt"

[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5

[wandb]
use_wandb = false
