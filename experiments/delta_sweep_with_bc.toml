# δ-uniform sweep with BC + curriculum p=0.3
# Tests δ ∈ {0.3, 0.7}. Combined with δ=0.5 from final.toml, gives a 3-point sweep.
#
# Usage:
#   python scripts/train_all.py --config experiments/delta_sweep_with_bc.toml --parallel

seeds = [42, 123, 456]
save_dir = "out/models_delta_sweep_bc"
results_dir = "out/results_delta_sweep_bc"

[[strategies]]
name = "delta_uniform"
delta = 0.3

[[strategies]]
name = "delta_uniform"
delta = 0.7

[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 3
n_steps = 2048
batch_size = 512
ent_coef = 0.01

[selfplay]
total_rounds = 300
rounds_per_side = 5
checkpoint_freq = 1
max_pool_size = 200
max_steps = 100
blue_scripted_opponent_prob = 0.3
blue_scripted_opponents = ["red_bline", "red_meander"]
blue_scripted_opponent_weights = [0.5, 0.5]
blue_pretrain_path = "out/models/blue_pretrained.pt"
red_pretrain_path = "out/models/red_pretrained.pt"

[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5

[wandb]
use_wandb = false
