# Final strategy evaluation against the VM-trained artifacts.
#
# Mirrors experiments/final.toml but points to the completed VM outputs.

seeds = [42, 123]
save_dir = "out_vm/models_final"
results_dir = "out_vm/results_final"

[[strategies]]
name = "vanilla"
delta = 1.0

[[strategies]]
name = "delta_uniform"
delta = 0.5

[[strategies]]
name = "pfsp"
delta = 0.0

[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 3
n_steps = 2048
batch_size = 512
ent_coef = 0.01

[selfplay]
total_rounds = 300
rounds_per_side = 5
checkpoint_freq = 1
max_pool_size = 200
max_steps = 100
blue_scripted_opponent_prob = 0.3
blue_scripted_opponents = ["red_bline", "red_meander"]
blue_scripted_opponent_weights = [0.5, 0.5]
blue_pretrain_path = "out/models/blue_pretrained.pt"
red_pretrain_path = "out/models/red_pretrained.pt"

[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5

[wandb]
use_wandb = false
