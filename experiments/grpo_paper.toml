# GRPO experiments - same as paper.toml but using GRPO instead of PPO.
#
# Usage:
#   python scripts/train_all.py --config experiments/grpo_paper.toml
#   python scripts/train_all.py --config experiments/grpo_paper.toml --parallel

algorithm = "grpo"
seeds = [42, 123, 456]
save_dir = "out/models_grpo"
results_dir = "out/results_grpo"

# Same strategies as PPO experiments for comparison

[[strategies]]
name = "vanilla"
delta = 1.0

[[strategies]]
name = "delta_uniform"
delta = 0.3

[[strategies]]
name = "delta_uniform"
delta = 0.5

[[strategies]]
name = "delta_uniform"
delta = 0.7

[[strategies]]
name = "pfsp"
delta = 0.0


[grpo]
learning_rate = 0.001
gamma = 0.99
clip_range = 0.2
n_epochs = 4
group_size = 8
batch_size = 64
ent_coef = 0.01
kl_coef = 0.1
max_grad_norm = 0.5
ref_update_freq = 10


[selfplay]
total_rounds = 500
rounds_per_side = 10
max_steps = 100
checkpoint_freq = 1
max_pool_size = 200
blue_pretrain_path = "out/models/blue_pretrained.pt"
red_pretrain_path = "out/models/red_pretrained.pt"


[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5


[wandb]
use_wandb = false
project = "mini-cage-selfplay-grpo"
