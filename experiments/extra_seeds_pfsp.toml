# Extra seeds for PFSP + BC + curriculum p=0.3
# Extends final.toml's PFSP condition from n=2 to n=5.
#
# Usage:
#   python scripts/train_all.py --config experiments/extra_seeds_pfsp.toml

seeds = [456, 789, 1024]
save_dir = "out/models_extra_seeds_pfsp"
results_dir = "out/results_extra_seeds_pfsp"

[[strategies]]
name = "pfsp"
delta = 0.0

[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 3
n_steps = 2048
batch_size = 512
ent_coef = 0.01

[selfplay]
total_rounds = 300
rounds_per_side = 5
checkpoint_freq = 1
max_pool_size = 200
max_steps = 100
blue_scripted_opponent_prob = 0.3
blue_scripted_opponents = ["red_bline", "red_meander"]
blue_scripted_opponent_weights = [0.5, 0.5]
blue_pretrain_path = "out/models/blue_pretrained.pt"
red_pretrain_path = "out/models/red_pretrained.pt"

[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5

[wandb]
use_wandb = false
