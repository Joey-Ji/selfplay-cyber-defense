# Final ablation study: 12 runs (6 configs x 2 seeds)
#
# Ablations:
#   Runs 1-2 vs 3-4:   Effect of Blue BC init (cold-start fix)
#   Runs 3-4 vs 5-6:   Effect of curriculum mixing (generalization)
#   Runs 5-6 vs 7-8 vs 9-10: Strategy comparison with all improvements
#   Runs 5-6 vs 11-12: Curriculum mixing intensity (p=0.3 vs p=0.5)
#
# Usage:
#   python scripts/train_all.py --config experiments/final.toml --parallel

seeds = [42, 123]
save_dir = "out/models_final"
results_dir = "out/results_final"

# --- Runs 1-2: vanilla, no BC, no curriculum ---
[[strategies]]
name = "vanilla"
delta = 1.0

# --- Runs 3-4: vanilla + Blue BC (handled via blue_pretrain_path) ---
# --- Runs 5-6: vanilla + Blue BC + curriculum p=0.3 ---
# --- Runs 11-12: vanilla + Blue BC + curriculum p=0.5 ---
# Note: BC and curriculum configs are set via selfplay section below.
# To run different configs, create separate TOML files or override via code.

# --- Runs 7-8: delta_uniform(0.5) + Blue BC + curriculum p=0.3 ---
[[strategies]]
name = "delta_uniform"
delta = 0.5

# --- Runs 9-10: pfsp + Blue BC + curriculum p=0.3 ---
[[strategies]]
name = "pfsp"
delta = 0.0

[ppo]
learning_rate = 0.002
gamma = 0.99
clip_range = 0.2
n_epochs = 3
n_steps = 2048
batch_size = 512
ent_coef = 0.01

[selfplay]
total_rounds = 300
rounds_per_side = 5
checkpoint_freq = 1
max_pool_size = 200
max_steps = 100
blue_scripted_opponent_prob = 0.3
blue_scripted_opponents = ["red_bline", "red_meander"]
blue_scripted_opponent_weights = [0.5, 0.5]
blue_pretrain_path = "out/models/blue_pretrained.pt"
red_pretrain_path = "out/models/red_pretrained.pt"

[eval]
br_steps = 200_000
crossplay_episodes = 200
crossplay_checkpoints = 10
exploit_checkpoints = 5

[wandb]
use_wandb = false
